<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TK Buje Portal</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="./icon.png" />
  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="TK Buje Portal" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#070707;
      --card:#111312;
      --text:#f3f3f3;
      --muted:#c9c9c9;
      --dim:#777;
      --orange:#ff6b2b;
      --blue:#3b82f6;
      --green:#22c55e;
      --border:rgba(255,255,255,.1);
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { min-height:100%; }
    body {
      font-family:Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:var(--bg);
      color:var(--text);
      overflow-x:hidden;
    }
    body::before {
      content:"";
      position:fixed;
      inset:0;
      background:
        radial-gradient(circle at 18% 22%, rgba(255,107,43,.13), transparent 34%),
        radial-gradient(circle at 78% 30%, rgba(34,197,94,.08), transparent 34%),
        radial-gradient(circle at 50% 110%, rgba(255,107,43,.08), transparent 42%),
        linear-gradient(180deg, #0d0d0d 0%, #050505 100%);
      z-index:-2;
    }
    body::after {
      content:"";
      position:fixed;
      inset:0;
      background-image:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size:54px 54px;
      mask-image:radial-gradient(circle at center, black, transparent 75%);
      z-index:-1;
      pointer-events:none;
    }
    .page {
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:48px 22px;
    }
    .wrap {
      width:100%;
      max-width:1180px;
      text-align:center;
    }
    .logo {
      display:inline-block;
      font-family:"Space Grotesk", Inter, sans-serif;
      font-size:clamp(1.45rem, 2.8vw, 2rem);
      font-weight:800;
      letter-spacing:-.04em;
      padding-bottom:10px;
      border-bottom:3px solid var(--orange);
      margin-bottom:46px;
      text-transform:uppercase;
    }
    .logo span { color:var(--orange); }
    h1 {
      font-family:"Space Grotesk", Inter, sans-serif;
      font-size:clamp(3rem, 8vw, 5.6rem);
      font-weight:900;
      letter-spacing:-.07em;
      line-height:.92;
      margin-bottom:20px;
      text-shadow:0 20px 60px rgba(0,0,0,.55);
    }
    h1 span { color:var(--orange); display:block; }
    .subtitle {
      color:var(--muted);
      font-size:clamp(1.05rem, 2.2vw, 1.45rem);
      margin-bottom:56px;
    }
    .grid {
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:22px;
    }
    .card {
      min-height:280px;
      border-radius:24px;
      border:1.5px solid var(--border);
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.08), transparent 34%),
        linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.018));
      box-shadow:0 24px 70px rgba(0,0,0,.38);
      padding:34px 24px 28px;
      text-decoration:none;
      color:var(--text);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:space-between;
      transition:transform .22s ease, box-shadow .22s ease, background .22s ease;
    }
    .card:hover {
      transform:translateY(-6px);
      box-shadow:0 32px 90px rgba(0,0,0,.55);
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.11), transparent 36%),
        linear-gradient(180deg, rgba(255,255,255,.065), rgba(255,255,255,.023));
    }
    .orange { border-color:rgba(255,107,43,.7); }
    .blue { border-color:rgba(59,130,246,.7); }
    .green { border-color:rgba(34,197,94,.7); }
    .icon {
      height:72px;
      display:flex;
      align-items:center;
      justify-content:center;
      margin-bottom:18px;
      filter:drop-shadow(0 14px 28px rgba(0,0,0,.45));
    }
    .emoji { font-size:3.5rem; line-height:1; }
    .tri {
      width:78px;
      height:64px;
      position:relative;
    }
    .tri span {
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      height:0;
      border-left:solid transparent;
      border-right:solid transparent;
      border-bottom:solid var(--orange);
      filter:drop-shadow(0 0 10px rgba(255,107,43,.35));
    }
    .tri span:nth-child(1) { top:0; border-left-width:18px; border-right-width:18px; border-bottom-width:24px; }
    .tri span:nth-child(2) { top:25px; border-left-width:32px; border-right-width:32px; border-bottom-width:16px; }
    .tri span:nth-child(3) { top:46px; border-left-width:45px; border-right-width:45px; border-bottom-width:13px; }
    .tri span::after {
      content:"";
      position:absolute;
      left:50%;
      bottom:-21px;
      transform:translateX(-50%);
      border-left:solid transparent;
      border-right:solid transparent;
      border-bottom:solid #111312;
    }
    .tri span:nth-child(1)::after { border-left-width:12px; border-right-width:12px; border-bottom-width:16px; bottom:-22px; }
    .tri span:nth-child(2)::after { border-left-width:25px; border-right-width:25px; border-bottom-width:11px; bottom:-15px; }
    .tri span:nth-child(3)::after { border-left-width:36px; border-right-width:36px; border-bottom-width:8px; bottom:-12px; }
    .title {
      font-size:1.45rem;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:-.045em;
      margin-bottom:12px;
    }
    .desc {
      color:var(--muted);
      font-size:1rem;
      line-height:1.45;
      min-height:46px;
    }
    .btn {
      margin-top:28px;
      min-width:138px;
      padding:12px 22px;
      border-radius:999px;
      border:1.5px solid currentColor;
      font-weight:900;
      font-size:.83rem;
      letter-spacing:.04em;
      text-transform:uppercase;
    }
    .orange .btn, .orange .icon { color:var(--orange); }
    .blue .btn { color:#46b9ff; }
    .green .btn { color:var(--green); }

    .isijas-icon-wrap {
      width:72px;
      height:72px;
      min-width:72px;
      max-width:72px;
      min-height:72px;
      max-height:72px;
      flex:0 0 72px;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      margin-bottom:18px;
    }
    .isijas-icon-wrap .isijas-icon {
      width:72px !important;
      height:72px !important;
      min-width:72px !important;
      max-width:72px !important;
      min-height:72px !important;
      max-height:72px !important;
      object-fit:contain !important;
      display:block !important;
    }

    .card.disabled {
      pointer-events:none;
      cursor:not-allowed;
      opacity:.48;
      filter:grayscale(.75);
      position:relative;
    }
    .card.disabled:hover {
      transform:none;
      box-shadow:0 24px 70px rgba(0,0,0,.38);
    }
    .card.disabled .btn {
      color:var(--dim);
      border-color:var(--dim);
    }

@media (max-width: 920px) {
      .page { align-items:flex-start; padding-top:36px; }
      .wrap { max-width:520px; }
      .logo { margin-bottom:38px; }
      h1 { font-size:clamp(2.4rem, 12vw, 4rem); }
      .subtitle { margin-bottom:32px; }
      .grid { grid-template-columns:1fr; gap:14px; }
      .card {
        min-height:0;
        flex-direction:row;
        text-align:left;
        justify-content:flex-start;
        align-items:center;
        gap:18px;
        padding:18px 20px;
        border-radius:16px;
      }
      .icon { width:76px; height:58px; margin:0; flex:0 0 76px; }
      .emoji { font-size:3rem; }
      .isijas-icon-wrap {
        width:76px;
        height:58px;
        min-width:76px;
        max-width:76px;
        min-height:58px;
        max-height:58px;
        flex:0 0 76px;
        margin:0;
      }
      .isijas-icon-wrap .isijas-icon {
        width:76px !important;
        height:58px !important;
        min-width:76px !important;
        max-width:76px !important;
        min-height:58px !important;
        max-height:58px !important;
      }

      .tri { transform:scale(.72); }
      .title { font-size:1.05rem; margin-bottom:5px; }
      .desc { font-size:.9rem; min-height:0; }
      .btn {
        margin:0 0 0 auto;
        min-width:0;
        padding:0;
        border:0;
        font-size:1.6rem;
      }
      .btn span { display:none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="wrap" aria-label="TK Buje portal">
      <div class="logo">TK <span>BUJE</span></div>
      <h1>Dobrodošli u <span>TK BUJE</span></h1>
      <p class="subtitle">Odaberite aplikaciju koju želite koristiti</p>

      <div class="grid">
        <a class="card orange" href="https://golencio.github.io/tkbuje-piramida/">
          <div class="icon"><div class="tri"><span></span><span></span><span></span></div></div>
          <div>
            <div class="title">Piramida</div>
            <div class="desc">Klupska piramida i izazovi</div>
          </div>
          <div class="btn"><span>Otvori</span> →</div>
        </a>

        <a class="card blue" href="https://turniri.tkbuje.hr/">
          <div class="icon"><div class="emoji">🎾</div></div>
          <div>
            <div class="title">Buje Mix</div>
            <div class="desc">Teniski švicarac turniri </div>
          </div>
          <div class="btn"><span>Otvori</span> →</div>
        </a>

        <a class="card green" href="https://isias.tkbuje.hr/">
          <div class="icon isijas-icon-wrap">
            <img src="isijas.png" alt="Išijas Liga" class="isijas-icon">
          </div>
          <div>
            <div class="title">Išijas Liga</div>
            <div class="desc">Najzabavnija liga na svijetu</div>
          </div>
          <div class="btn"><span>Otvori</span> →</div>
        </a>

        <a class="card orange" href="https://golencio.github.io/tkbuje/">
          <div class="icon"><div class="emoji">🏆</div></div>
          <div>
            <div class="title">Parići</div>
            <div class="desc">Parići i klupska ljestvica</div>
          </div>
          <div class="btn"><span>Otvori</span> →</div>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
